<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f8fafc"/><style>.t{font:700 27px Arial;fill:#0f172a;text-anchor:middle}.s{font:400 15px Arial;fill:#475569;text-anchor:middle}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:18}.bl{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:18}.gr{fill:#ecfeff;stroke:#0e7490;stroke-width:2;rx:18}.go{fill:#fef3c7;stroke:#92400e;stroke-width:2;rx:18}.g{font:700 17px Arial;fill:#0f172a;text-anchor:middle}.a{font:400 14px Arial;fill:#475569;text-anchor:middle}.ar{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#64748b"/></marker></defs><text x="750" y="42" class="t">Step 5 — Deep Narrative First + Lightweight Continuity</text><text x="750" y="68" class="s">New reports relate to prior reviews through lineage, deltas and Threads — not repeated historical prose.</text><rect x="60" y="115" width="280" height="105" class="bl"/><text x="200" y="155" class="g">Current Evidence</text><text x="200" y="183" class="a">Normalized snapshot</text><text x="200" y="204" class="a">facts + current state</text><rect x="380" y="115" width="310" height="105" class="b"/><text x="535" y="155" class="g">Previous Review</text><text x="535" y="183" class="a">Key Takeaways only</text><text x="535" y="204" class="a">not the full report</text><rect x="730" y="115" width="300" height="105" class="go"/><text x="880" y="155" class="g">Evidence Delta</text><text x="880" y="183" class="a">Current vs previous</text><text x="880" y="204" class="a">deterministic changes</text><rect x="1070" y="115" width="360" height="105" class="gr"/><text x="1250" y="155" class="g">Relevant Threads</text><text x="1250" y="183" class="a">Active / Watching +</text><text x="1250" y="204" class="a">changed Thread Versions</text><path d="M340 168 L380 168" class="ar"/><path d="M690 168 L730 168" class="ar"/><path d="M1030 168 L1070 168" class="ar"/><rect x="390" y="300" width="720" height="135" class="bl"/><text x="750" y="342" class="g">Gemini — One Deep Analysis Pass</text><text x="750" y="372" class="a">Business model → earnings → moat → competition → valuation</text><text x="750" y="397" class="a">→ drivers → catalysts → risks → what matters now → monitor</text><path d="M200 220 L480 300" class="ar"/><path d="M535 220 L620 300" class="ar"/><path d="M880 220 L790 300" class="ar"/><path d="M1250 220 L1030 300" class="ar"/><rect x="80" y="510" width="380" height="125" class="gr"/><text x="270" y="552" class="g">Master Research Report</text><text x="270" y="580" class="a">One coherent English research note</text><text x="270" y="602" class="a">includes “What Changed”</text><rect x="560" y="510" width="380" height="125" class="go"/><text x="750" y="552" class="g">Key Takeaways</text><text x="750" y="580" class="a">3–6 high-value conclusions</text><text x="750" y="602" class="a">derived from current report</text><rect x="1040" y="510" width="380" height="125" class="b"/><text x="1230" y="552" class="g">Thread Actions</text><text x="1230" y="580" class="a">continue · update · create</text><text x="1230" y="602" class="a">deprioritize · close · ephemeral</text><path d="M600 435 L270 510" class="ar"/><path d="M750 435 L750 510" class="ar"/><path d="M900 435 L1230 510" class="ar"/><rect x="310" y="710" width="880" height="65" class="b"/><text x="750" y="738" class="g">Longitudinal continuity = Report Lineage + Evidence Delta + Thread ID / Thread Version</text></svg>